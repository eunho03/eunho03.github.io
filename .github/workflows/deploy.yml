name: Build and deploy academic website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: website
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize al-folio source if needed
        shell: bash
        run: |
          if [ ! -f Gemfile ]; then
            curl --fail --location https://github.com/alshedivat/al-folio/archive/929fbf71c5a45b13e9b5a20dfa425ce9e9de7935.tar.gz -o /tmp/al-folio.tar.gz
            mkdir /tmp/al-folio-source
            tar -xzf /tmp/al-folio.tar.gz -C /tmp/al-folio-source --strip-components=1
            rm -rf /tmp/al-folio-source/.github /tmp/al-folio-source/.agents /tmp/al-folio-source/.codex /tmp/al-folio-source/.claude /tmp/al-folio-source/.gemini
            cp -a /tmp/al-folio-source/. .
            python3 - <<'PYCODE'
          import base64,json,shutil
          from pathlib import Path
          for name in ['_pages','_posts','_projects','_news','_books','_teachings','_bibliography']:
              shutil.rmtree(name,ignore_errors=True)
          data=json.loads(base64.b64decode(''))
          for name,text in data.items():
              path=Path(name)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text)
          Path('README.md').write_text('# Eun Ho Koh\n\nAcademic website: https://eunho03.github.io\n\nEdit `_pages/about.md`, `_pages/projects.md`, and `_pages/cv.md` to update the website. Built with al-folio (MIT license).\n')
          PYCODE
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m 'Initialize personalized al-folio source'
            git push
          fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies and build
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          pip install nbconvert
          JEKYLL_ENV=production bundle exec jekyll build
      
      - name: Generate CV PDF
        run: |
          sudo apt-get install -y pandoc texlive-xetex texlive-lang-cjk fonts-noto-cjk

          python3 - <<'PY'
          from pathlib import Path
          import re

          content = Path("_pages/cv.md").read_text()
          content = re.sub(
              r"\A---\s*\n.*?\n---\s*\n",
              "",
              content,
              flags=re.S
          )
          content = re.sub(
              r"<br\s*/?>", "\n\n", content
          )

          Path("/tmp/cv-content.md").write_text(content)
          PY

          mkdir -p _site

          pandoc /tmp/cv-content.md \
            -o _site/CV.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=0.7in \
            -V mainfont="DejaVu Serif" \
            -V CJKmainfont="Noto Sans CJK KR"

      - name: Publish built site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
      
